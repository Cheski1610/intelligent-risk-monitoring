[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-risk-monitoring-lab"
version = "0.1.0"
description = "Laboratorio educativo para monitoreo inteligente de riesgos con PaySim"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "plotly>=5.24",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "scikit-learn>=1.5",
  "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
